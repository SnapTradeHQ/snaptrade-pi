[project]
name = "snaptrade-portfolio-display"
version = "0.1.0"
description = "Raspberry Pi e-paper display for a SnapTrade portfolio total."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
  "qrcode[pil]>=7.4.2",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

